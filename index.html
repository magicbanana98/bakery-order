<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pugon Pan: order bread for pickup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>Pugon Pan</h1>
    <p>Bread baked in a wood-fired oven every morning. Order ahead and pick it up warm.</p>
  </header>

  <main class="layout">
    <section aria-labelledby="menu-title">
      <h2 id="menu-title">Today’s bread</h2>
      <ul id="menuList" class="menu"></ul>
    </section>

    <section class="order" aria-labelledby="order-title">
      <form id="orderForm" novalidate>
        <h2 id="order-title">Your order</h2>
        <ul id="cart" class="cart"></ul>
        <p class="total">Total <strong id="total">₱0</strong></p>

        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="phone">Mobile number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>

        <label for="pickup">Pickup time</label>
        <select id="pickup" name="pickup" required>
          <option value="">Choose a time</option>
          <option>6:00 AM</option>
          <option>7:00 AM</option>
          <option>8:00 AM</option>
          <option>9:00 AM</option>
        </select>

        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" rows="2"></textarea>

        <p id="error" class="error" role="alert"></p>
        <button type="submit" class="primary">Place order</button>
      </form>

      <div id="confirmation" class="confirmation" hidden>
        <h2>Order placed</h2>
        <p id="confirmText"></p>
        <ul id="confirmItems" class="cart"></ul>
        <p class="total">Total <strong id="confirmTotal"></strong></p>
        <button type="button" id="again" class="primary">Start a new order</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
